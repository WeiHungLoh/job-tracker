services:
    frontend:
        build:
            context: ./client
        environment:
            NODE_ENV: development
            VITE_API_URL: /api
            VITE_API_PROXY_TARGET: http://backend:5005
        ports:
            - '5173:5173'
        volumes:
            - ./client:/app
            - frontend_node_modules:/app/node_modules
        depends_on:
            - backend

    backend:
        build:
            context: ./server
        command: ['npm', 'run', 'dev']
        env_file:
            - ./server/.env
        environment:
            NODE_ENV: development
            PORT: '5005'
        ports:
            - '5005:5005'
        volumes:
            - ./server:/app
            - backend_node_modules:/app/node_modules

volumes:
    frontend_node_modules:
    backend_node_modules:
