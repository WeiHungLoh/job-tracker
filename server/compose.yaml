services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        command: ['npm', 'run', 'dev']
        env_file:
            - .env
        environment:
            NODE_ENV: development
            PORT: '5005'
        ports:
            - '5005:5005'
        volumes:
            - .:/app
            - backend_node_modules:/app/node_modules

volumes:
    backend_node_modules:
