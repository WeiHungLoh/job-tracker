services:
    frontend:
        build:
            context: .
        environment:
            NODE_ENV: development
            VITE_API_URL: /api
            VITE_API_PROXY_TARGET: ${DOCKER_API_PROXY_TARGET:-http://host.docker.internal:5005}
        ports:
            - '5173:5173'
        volumes:
            - .:/app
            - frontend_node_modules:/app/node_modules

volumes:
    frontend_node_modules:
