<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" sizes="512x512" href="/job.png" />
        <link rel="canonical" href="https://jobtracker.weihungloh.com" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="Track your job applications, interviews and offers in one focused workspace."
        />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Job Tracker" />
        <meta property="og:title" content="Job Tracker | Organise your job search" />
        <meta
            property="og:description"
            content="Track your job applications, interviews and offers in one focused workspace."
        />
        <meta property="og:url" content="https://jobtracker.weihungloh.com" />
        <meta property="og:image" content="https://jobtracker.weihungloh.com/job-tracker-social-preview.png" />
        <meta property="og:image:url" content="https://jobtracker.weihungloh.com/job-tracker-social-preview.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:alt" content="Job Tracker — organise your job search" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Job Tracker | Organise your job search" />
        <meta
            name="twitter:description"
            content="Track your job applications, interviews and offers in one focused workspace."
        />
        <meta name="twitter:image" content="https://jobtracker.weihungloh.com/job-tracker-social-preview.png" />
        <meta name="twitter:image:alt" content="Job Tracker — organise your job search" />
        <link rel="apple-touch-icon" type="image/png" sizes="512x512" href="/job.png" />
        <script src="/theme-init.js"></script>
        <title>Job Tracker</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <svg aria-hidden="true" focusable="false" height="0" style="position: absolute" width="0">
            <defs>
                <filter
                    id="activity-control-refraction"
                    x="-20%"
                    y="-20%"
                    width="140%"
                    height="140%"
                    color-interpolation-filters="sRGB"
                >
                    <feTurbulence
                        type="fractalNoise"
                        baseFrequency="0.012 0.038"
                        numOctaves="1"
                        seed="11"
                        result="noise"
                    />
                    <feGaussianBlur in="noise" stdDeviation="1.15" result="softNoise" />
                    <feDisplacementMap
                        in="SourceGraphic"
                        in2="softNoise"
                        scale="8"
                        xChannelSelector="R"
                        yChannelSelector="G"
                    />
                </filter>
                <filter
                    id="activity-menu-refraction"
                    x="-20%"
                    y="-20%"
                    width="140%"
                    height="140%"
                    color-interpolation-filters="sRGB"
                >
                    <feTurbulence
                        type="fractalNoise"
                        baseFrequency="0.012 0.038"
                        numOctaves="1"
                        seed="11"
                        result="noise"
                    />
                    <feGaussianBlur in="noise" stdDeviation="1.15" result="softNoise" />
                    <feDisplacementMap
                        in="SourceGraphic"
                        in2="softNoise"
                        scale="11"
                        xChannelSelector="R"
                        yChannelSelector="G"
                    />
                </filter>
            </defs>
        </svg>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
